# sakura: don't remember browser stream volumes, so a quieter music tab (dashboard Media slider)
# doesn't make every later tab / video quieter too
stream.rules = [
  {
    matches = [
      { application.process.binary = "~(brave|chromium|chrome|vivaldi|opera|msedge|yandex_browser|thorium|firefox|librewolf|zen|floorp|waterfox).*" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
      }
    }
  }
]
