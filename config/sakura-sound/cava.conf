[general]
bars = 48
framerate = 60
autosens = 1
[input]
method = pipewire
# only our mpv stream (its PipeWire node.name = mpv --audio-client-name), not Discord or other apps
source = Sakura Sound
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
channels = mono
[smoothing]
monstercat = 1
noise_reduction = 70
