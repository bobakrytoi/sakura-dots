# sakura - mpv (UI: uosc + thumbfast in scripts/, theme in script-opts/uosc.conf)
# --- window: fit inside the screen, never under the top bar / dock (Hyprland centers it, see hyprland.lua "mpv") ---
autofit-larger=80%x80%
autofit-smaller=40%x40%
geometry=50%:50%
keepaspect-window=yes
snap-window=yes
# --- uosc replaces the stock OSC ---
osc=no
osd-bar=no
border=no
title-bar=no
osd-font='Inter'
osd-font-size=30
osd-color='#e8eaf0'
osd-border-size=0
osd-shadow-offset=0
# --- playback ---
hwdec=auto-safe
vo=gpu-next
profile=high-quality
keep-open=yes
save-position-on-quit=yes
watch-later-options-remove=fullscreen
volume=100
volume-max=150
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
# --- subtitles ---
sub-auto=fuzzy
slang=ru,rus,en,eng
alang=ru,rus,jpn,ja,en,eng
sub-font='Inter'
sub-bold=yes
sub-font-size=40
sub-color='#ffffff'
sub-border-size=2.5
sub-border-color='#cc0f1119'
sub-shadow-offset=1
sub-shadow-color='#660f1119'
sub-margin-y=48
sub-ass-override=scale
