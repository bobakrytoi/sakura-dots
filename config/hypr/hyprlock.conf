# sakura mono — lock screen
$fg     = rgb(eceef4)
$muted  = rgb(8a8fa3)
$accent = rgb(f2b8d0)
$font   = Inter

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 6, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/main.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.2
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 120
    font_family = Inter Display ExtraBold
    position = 0, 280
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 20
    font_family = $font
    position = 0, 170
    halign = center
    valign = center
}

# avatar
image {
    monitor =
    path = ~/.config/hypr/assets/avatar.png
    size = 130
    rounding = -1
    border_size = 3
    border_color = $accent
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = $fg
    font_size = 16
    font_family = Inter SemiBold
    position = 0, -75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    rounding = 18
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(ffffff22)
    inner_color = rgba(0f1119aa)
    font_color = $fg
    check_color = $accent
    fail_color = rgb(f28fad)
    capslock_color = rgb(f4dcb0)
    fade_on_empty = false
    placeholder_text = <span foreground="##8a8fa3">password...</span>
    fail_text = <span foreground="##f28fad">wrong password ($ATTEMPTS)</span>
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
}

# keyboard layout pill (click to switch)
shape {
    monitor =
    size = 74, 34
    color = rgba(f2b8d0ee)
    rounding = 12
    position = 0, -222
    halign = center
    valign = center
}
label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = rgb(1a121a)
    font_size = 15
    font_family = Inter ExtraBold
    onclick = hyprctl switchxkblayout all next
    position = 0, -222
    halign = center
    valign = center
}
label {
    monitor =
    text = Alt + Shift to switch
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, -262
    halign = center
    valign = center
}
