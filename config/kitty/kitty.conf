# ✿ sakura mono — kitty
font_family      JetBrainsMono Nerd Font
font_size        12.0
disable_ligatures never

background_opacity 0.82
background_blur    0
window_padding_width 16
hide_window_decorations no
wayland_titlebar_color background
confirm_os_window_close 0
enable_audio_bell no

cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0.5

scrollback_lines 10000
url_style curly
copy_on_select yes
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round

# colors
foreground            #eceef4
background            #0f1119
selection_foreground  #1a121a
selection_background  #f2b8d0
cursor                #f2b8d0
cursor_text_color     #0f1119
url_color             #f2b8d0
active_tab_foreground   #1a121a
active_tab_background   #f2b8d0
inactive_tab_foreground #8a8fa3
inactive_tab_background #1a1d28

color0  #1a1d28
color8  #4a4f63
color1  #f28fad
color9  #f7a8bf
color2  #b5e3c4
color10 #c9edd4
color3  #f4dcb0
color11 #f8e7c8
color4  #a9b8f0
color12 #c0cbf5
color5  #f2b8d0
color13 #f7cfe0
color6  #a8dde6
color14 #c2e8ee
color7  #c9ccd8
color15 #ffffff

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
remember_window_size no
initial_window_width  1000
initial_window_height 620
